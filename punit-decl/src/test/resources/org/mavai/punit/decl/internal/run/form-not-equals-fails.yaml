format: mavai-contract/1
contract: form-not-equals-fails
service: form-oracle
transforms:
  doc: json
criteria:
  - name: the-form-holds
    threshold: 0.9
    postconditions:
      - parses: doc
      - path: "$.status"
        not-equals: "approved"
inputs:
  - "judge the document"
  - "judge it again"
