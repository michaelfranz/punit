format: mavai-contract/1
contract: form-one-of-holds
service: form-oracle
transforms:
  doc: json
criteria:
  - name: the-form-holds
    threshold: 0.9
    postconditions:
      - parses: doc
      - path: "$.status"
        one-of: ["approved", "pending"]
inputs:
  - "judge the document"
  - "judge it again"
