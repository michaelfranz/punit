format: mavai-contract/1
contract: form-equals-set-fails
service: form-oracle
transforms:
  doc: json
criteria:
  - name: the-form-holds
    threshold: 0.9
    postconditions:
      - parses: doc
      - in: doc
        path: "$.tags[*]"
        equals-set: ["a", "b"]
inputs:
  - "judge the document"
  - "judge it again"
