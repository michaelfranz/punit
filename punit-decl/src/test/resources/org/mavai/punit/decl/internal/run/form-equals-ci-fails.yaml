format: mavai-contract/1
contract: form-equals-ci-fails
service: form-oracle
transforms:
  doc: json
criteria:
  - name: the-form-holds
    threshold: 0.9
    postconditions:
      - parses: doc
      - path: "$.padded"
        equals-ci: "hello there"
inputs:
  - "judge the document"
  - "judge it again"
